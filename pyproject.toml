[project]
name = "ontok-workspace"
version = "0.0.0"
description = "Workspace for the ONTOK semantic module packages."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Kyle Tobin", email = "tobin.kyle@gmail.com" }]
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/python/*"]

[dependency-groups]
dev = ["basedpyright", "import-linter", "pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests", "packages/python"]
strict_config = true
strict_markers = true
xfail_strict = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["packages/python", "tests"]
extend-exclude = ["templates"]

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","A","C4","PIE","RET","SIM","ARG","PTH","ERA","PL","TRY","RUF","ANN","S","FBT","TC","EM"]
ignore = ["ANN401","TRY003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel","pydantic.RootModel"]

[tool.ruff.lint.isort]
known-first-party = ["ontok"]

[tool.basedpyright]
include = ["packages/python", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.importlinter]
root_packages = ["ontok.core"]

[[tool.importlinter.contracts]]
name = "ONTOK modules follow workspace dependencies"
type = "layers"
layers = ["ontok.core"]
