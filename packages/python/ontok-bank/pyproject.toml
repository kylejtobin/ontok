[project]
name = "ontok-bank"
version = "0.0.0"
description = "The bank: the organization whose tellers, clerks, and bookkeeper run on ontok-nats. Its composition root is the proof the conformance tests exercise."
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Kyle Tobin", email = "tobin.kyle@gmail.com" }]
dependencies = [
    "ontok-nats>=0.0.0,<0.1.0",
    "nats-py>=2.10,<3",
    "pydantic>=2.9,<3",
]
import-names = ["ontok.bank"]
import-namespaces = ["ontok"]

[project.scripts]
ontok-bank = "ontok.bank.main:run"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
ontok-nats = { workspace = true }

[tool.uv.build-backend]
module-name = "ontok.bank"
