[project]
name = "ontok-bus"
version = "0.0.0"
description = "Provider-independent event transport domain for ONTOK."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kyle Tobin", email = "tobin.kyle@gmail.com" }]
keywords = [
    "ontok",
    "bus",
    "events",
    "transport",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["ontok-core>=0.1.0,<0.2.0"]
import-names = ["ontok.bus"]
import-namespaces = ["ontok"]

[project.urls]
Homepage = "https://github.com/kyzobuild/ontok"
Repository = "https://github.com/kyzobuild/ontok"
Issues = "https://github.com/kyzobuild/ontok/issues"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
ontok-core = { workspace = true }

[tool.uv.build-backend]
module-name = "ontok.bus"
