[project]
name = "ontok-events"
version = "0.0.0"
description = "An organization's memory and its work upon it: occurrences, responsibilities, delivery, and recording in ONTOK."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kyle Tobin", email = "tobin.kyle@gmail.com" }]
keywords = ["ontok", "events", "event-sourcing", "work"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["ontok-core>=0.1.0,<0.2.0", "pydantic>=2.9,<3"]
import-names = ["ontok.events"]
import-namespaces = ["ontok"]

[project.urls]
Homepage = "https://github.com/kylejtobin/ontok"
Repository = "https://github.com/kylejtobin/ontok"
Issues = "https://github.com/kylejtobin/ontok/issues"
Architecture = "https://github.com/kylejtobin/ontok/blob/main/wiki/architecture/ontok-events.md"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
ontok-core = { workspace = true }

[tool.uv.build-backend]
module-name = "ontok.events"
source-include = ["tests/**"]
