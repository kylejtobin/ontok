[project]
name = "ontok-eventcatalog"
version = "0.0.0"
description = "Projects an ONTOK organization, its kinds, responsibilities, occurrences, and provenance, into EventCatalog resources."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kyle Tobin", email = "tobin.kyle@gmail.com" }]
keywords = ["ontok", "eventcatalog", "visualization", "asyncapi"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["ontok-events>=0.0.0,<0.1.0", "pydantic>=2.9,<3"]
import-names = ["ontok.eventcatalog"]
import-namespaces = ["ontok"]

[project.urls]
Homepage = "https://github.com/kylejtobin/ontok"
Repository = "https://github.com/kylejtobin/ontok"
Issues = "https://github.com/kylejtobin/ontok/issues"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
ontok-events = { workspace = true }

[tool.uv.build-backend]
module-name = "ontok.eventcatalog"
source-include = ["tests/**"]
