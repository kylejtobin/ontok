jetstream { store_dir: /data }
accounts {
  ORG {
    jetstream: enabled
    users: [
      { user: admin, password: admin }
      { user: program, password: program, permissions: {
          publish: {
            allow: [
              "event.>",
              "$JS.API.INFO",
              "$JS.API.STREAM.INFO.*",
              "$JS.API.DIRECT.GET.EVENTS", "$JS.API.DIRECT.GET.*.>",
              "$JS.API.CONSUMER.CREATE.EVENTS", "$JS.API.CONSUMER.CREATE.EVENTS.>",
              "$JS.API.CONSUMER.INFO.EVENTS.*", "$JS.API.CONSUMER.DELETE.EVENTS.*",
              "$JS.ACK.EVENTS.>", "$JS.ACK.*.*.EVENTS.>",
              "$KV.*.>",
              "$JS.API.STREAM.CREATE.*", "$JS.API.STREAM.DELETE.*"
            ]
            deny: [
              "$JS.API.STREAM.CREATE.EVENTS", "$JS.API.STREAM.DELETE.EVENTS",
              "$JS.API.STREAM.UPDATE.EVENTS", "$JS.API.STREAM.PURGE.EVENTS",
              "$JS.API.STREAM.MSG.DELETE.EVENTS"
            ]
          }
          subscribe: ["_INBOX.>"]
        } }
    ]
  }
}
