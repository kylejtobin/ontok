[project]
name = "__DISTRIBUTION_NAME__"
version = "__VERSION__"
description = "__DESCRIPTION__"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kyle Tobin", email = "tobin.kyle@gmail.com" }]
keywords = [
    "__KEYWORDS__",
]
classifiers = [
    "Development Status :: __STATUS__",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "__DEPENDENCIES__",
]
import-names = ["ontok.__MODULE_NAME__"]
import-namespaces = ["ontok"]

[project.urls]
Homepage = "https://github.com/kylejtobin/ontok"
Repository = "https://github.com/kylejtobin/ontok"
Issues = "https://github.com/kylejtobin/ontok/issues"
Specification = "__SPECIFICATION_URL__"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ontok.__MODULE_NAME__"
source-include = ["tests/**"]

# Workspace dependency for local development:
# [tool.uv.sources]
# ontok-core = { workspace = true }
